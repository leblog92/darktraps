<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Dark Traps</title>
	<link rel="icon" type="image/png" href="icon.png" />
	<link rel="preconnect" href="https://fonts.gstatic.com">
	<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
	<style>
		html, body {
			height: 100%;
			margin: 0;
			overflow: hidden;
		}

		body {
			background: linear-gradient(135deg, rgba(0,0,0,1), rgba(120,0,0,0.6), rgba(0,0,0,1)), url("floor.png");
			font-family: 'MedievalSharp', cursive;
			text-align: center;
		}

		.main {
			height: 100%;
			width: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		/* ── HUD ── */
		.hud {
			position: fixed;
			z-index: 10;
			pointer-events: none;
			user-select: none;
			font-family: 'MedievalSharp', cursive;
			color: #e8d5a0;
			text-shadow: 0 0 8px rgba(255,120,0,0.6);
		}

		#hud-title {
			top: 10px;
			left: 10px;
			background: rgba(0,0,0,0.65);
			border: 1px solid rgba(200,100,0,0.4);
			border-radius: 8px;
			padding: 8px 14px;
			font-size: 18px;
			letter-spacing: 3px;
		}

		#hud-room {
			top: 10px;
			left: 50%;
			transform: translateX(-50%);
			background: rgba(0,0,0,0.65);
			border: 1px solid rgba(200,100,0,0.4);
			border-radius: 8px;
			padding: 6px 18px;
			font-size: 15px;
		}

		#hud-life {
			top: 10px;
			right: 10px;
			background: rgba(0,0,0,0.65);
			border: 1px solid rgba(180,0,0,0.5);
			border-radius: 8px;
			padding: 8px 14px;
			font-size: 20px;
			line-height: 1.4;
			text-align: right;
		}

		#hud-kills {
			bottom: 10px;
			right: 10px;
			background: rgba(0,0,0,0.65);
			border: 1px solid rgba(200,100,0,0.4);
			border-radius: 8px;
			padding: 8px 14px;
			font-size: 14px;
		}

		#hud-ammo {
			bottom: 10px;
			left: 10px;
			background: rgba(0,0,0,0.65);
			border: 1px solid rgba(200,100,0,0.4);
			border-radius: 8px;
			padding: 8px 14px;
			font-size: 14px;
		}

		/* ammo bar */
		.ammo-bar-bg {
			width: 120px;
			height: 8px;
			background: rgba(255,255,255,0.15);
			border-radius: 4px;
			margin-top: 5px;
			overflow: hidden;
		}
		#ammo-bar-fill {
			height: 100%;
			width: 100%;
			background: linear-gradient(90deg, #ff6a00, #ffd700);
			border-radius: 4px;
			transition: width 0.15s;
		}

		/* life bar */
		.life-bar-bg {
			width: 120px;
			height: 8px;
			background: rgba(255,255,255,0.15);
			border-radius: 4px;
			margin-top: 5px;
			overflow: hidden;
			float: right;
		}
		#life-bar-fill {
			height: 100%;
			width: 100%;
			background: linear-gradient(90deg, #cc0000, #ff4444);
			border-radius: 4px;
			transition: width 0.3s;
		}

		/* damage flash overlay */
		#damage-flash {
			position: fixed;
			inset: 0;
			background: rgba(180,0,0,0);
			pointer-events: none;
			z-index: 20;
			transition: background 0.1s;
		}

		/* game over / win screen */
		#overlay {
			display: none;
			position: fixed;
			inset: 0;
			background: rgba(0,0,0,0.88);
			z-index: 30;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			font-family: 'MedievalSharp', cursive;
			color: #e8d5a0;
		}
		#overlay.active { display: flex; }
		#overlay h1 {
			font-size: 64px;
			margin: 0 0 12px;
			text-shadow: 0 0 30px rgba(255,80,0,0.8);
			letter-spacing: 6px;
		}
		#overlay p {
			font-size: 20px;
			color: #aaa;
			margin: 0 0 32px;
		}
		#overlay button {
			font-family: 'MedievalSharp', cursive;
			font-size: 22px;
			color: #e8d5a0;
			background: rgba(120,40,0,0.8);
			border: 2px solid rgba(255,120,0,0.6);
			border-radius: 8px;
			padding: 12px 36px;
			cursor: pointer;
			letter-spacing: 3px;
			transition: background 0.2s, transform 0.1s;
		}
		#overlay button:hover {
			background: rgba(200,60,0,0.9);
			transform: scale(1.05);
		}

		/* notification popup */
		#notif {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			background: rgba(0,0,0,0.8);
			border: 1px solid rgba(200,100,0,0.5);
			border-radius: 10px;
			padding: 14px 28px;
			font-family: 'MedievalSharp', cursive;
			font-size: 22px;
			color: #ffd700;
			pointer-events: none;
			z-index: 25;
			opacity: 0;
			transition: opacity 0.4s;
		}

		/* SVG canvas */
		#svg1 {
			width: min(900px, 98vmin);
			height: min(900px, 98vmin);
			box-shadow: 0 0 40px rgba(200,60,0,0.4), 10px 10px 20px rgba(0,0,0,0.6);
			cursor: crosshair;
			display: block;
		}

		#doorL, #doorR { transition: transform 6s ease-in-out; }
		#text_start    { transition: transform 6s; font-family: 'MedievalSharp', cursive; }
		#title         { transition: transform 6s, opacity 6s; }
		#scale1        { transition: transform 3s; }
		#light         { transition: r 9s; }
		#torchlight    { transition: r 9s; }
		#ray           { transition: stroke-width 9s; }
		#start         { transition: opacity 1s; }

		g[id^="idm_"]  { transition: transform 300ms linear; }
	</style>
</head>
<body>

<!-- Audio -->
<audio id="snd-step"><source src="step.mp3" type="audio/mpeg"></audio>
<audio id="snd-tune" loop><source src="tune2.mp3" type="audio/mpeg"></audio>
<audio id="snd-bite"><source src="bite.mp3" type="audio/mpeg"></audio>

<!-- HUD -->
<div id="hud-title"  class="hud">⚔ DARK TRAPS</div>
<div id="hud-room"   class="hud">SALLE 1</div>
<div id="hud-life"   class="hud">
	❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️
	<div class="life-bar-bg"><div id="life-bar-fill"></div></div>
</div>
<div id="hud-kills"  class="hud">☠ Kills : <span id="kill-count">0</span></div>
<div id="hud-ammo"   class="hud">
	🔥 Munitions : <span id="ammo-count">100</span>
	<div class="ammo-bar-bg"><div id="ammo-bar-fill"></div></div>
</div>

<!-- Damage flash -->
<div id="damage-flash"></div>

<!-- Notification -->
<div id="notif"></div>

<!-- Game Over / Win overlay -->
<div id="overlay">
	<h1 id="overlay-title">GAME OVER</h1>
	<p id="overlay-sub">Tu as survécu jusqu'à la salle <span id="overlay-room">1</span> — <span id="overlay-kills">0</span> kills</p>
	<button onclick="location.reload()">↩ REJOUER</button>
</div>

<!-- Game -->
<div class="main">
<svg id="svg1" viewBox="0 0 900 900">
<defs>
	<filter height="200%" width="200%" y="-50%" x="-50%" id="f1">
		<feGaussianBlur stdDeviation="25" in="SourceGraphic"/>
	</filter>
	<mask id="hide">
		<rect x="0" y="0" width="900" height="900" fill="#fff"/>
		<g filter="url(#f1)">
			<path d="m450 850L450 850" stroke-width="0" fill="none" stroke="#999" id="ray" stroke-linecap="round"/>
			<g transform="translate(450 850)" id="position_light">
				<circle opacity="1" cx="0" cy="0" r="0" fill="#999" id="light"/>
			</g>
			<g transform="translate(450 850)" id="torchlight_position">
				<circle cx="0" cy="0" r="0" fill="#000" id="torchlight"/>
			</g>
		</g>
	</mask>
</defs>

<image x="0" y="0" width="900" height="900" href="floor.png"/>
<g id="hole_area"></g>
<image id="walls" x="0" y="0" width="900" height="900" href="1111.png"/>

<g transform="translate(450 850)" id="player">
	<g transform="rotate(-90 0 0)" id="rotate1">
		<image x="-50" y="-50" width="100" height="100" href="player.gif"/>
	</g>
</g>

<rect x="0" y="0" width="900" height="900" fill="#000" opacity="1" style="mask:url(#hide)"/>
<g id="monster_area"></g>

<!-- Intro screen -->
<g id="start" transform="translate(450 450)">
	<g transform="scale(1)" id="scale1">
		<g transform="translate(0 0)" id="doorL">
			<image x="-450" y="-450" width="900" height="900" href="doorL.png"/>
		</g>
		<g transform="translate(0 0)" id="doorR">
			<image x="-450" y="-450" width="900" height="900" href="doorR.png"/>
		</g>
		<image x="-450" y="-450" width="900" height="900" href="arch.png" id="arch"/>
		<image x="-450" y="-450" width="900" height="900" href="shade.png" id="shade"/>
		<image x="-450" y="-450" width="900" height="900" href="title.png" id="title" opacity="0.5"/>
		<g transform="translate(0 300)" id="g_text_start">
			<text x="0" y="0" fill="white" font-size="60" text-anchor="middle" dominant-baseline="middle" font-family="MedievalSharp,cursive">GAME START</text>
		</g>
		<image x="-450" y="-450" width="900" height="900" href="fog.png" id="fog" opacity="0.4"/>
	</g>
</g>
</svg>
</div>

<script>
/*jshint esversion: 6 */
'use strict';

// ── DOM refs ──────────────────────────────────────────────────────────
const svg1             = document.getElementById('svg1');
const startGroup       = document.getElementById('start');
const doorL            = document.getElementById('doorL');
const doorR            = document.getElementById('doorR');
const maskHide         = document.getElementById('hide');
const holeArea         = document.getElementById('hole_area');
const walls            = document.getElementById('walls');
const gTextStart       = document.getElementById('g_text_start');
const scale1           = document.getElementById('scale1');
const player           = document.getElementById('player');
const rotate1          = document.getElementById('rotate1');
const positionLight    = document.getElementById('position_light');
const light            = document.getElementById('light');
const torchlight       = document.getElementById('torchlight');
const torchlightPos    = document.getElementById('torchlight_position');
const ray              = document.getElementById('ray');
const monsterArea      = document.getElementById('monster_area');
const titleImg         = document.getElementById('title');
const damageFlash      = document.getElementById('damage-flash');
const overlay          = document.getElementById('overlay');
const overlayTitle     = document.getElementById('overlay-title');
const overlaySub       = document.getElementById('overlay-sub');
const overlayRoom      = document.getElementById('overlay-room');
const overlayKills     = document.getElementById('overlay-kills');
const notif            = document.getElementById('notif');
const hudRoom          = document.getElementById('hud-room');
const hudLife          = document.getElementById('hud-life');
const hudKillCount     = document.getElementById('kill-count');
const hudAmmoCount     = document.getElementById('ammo-count');
const ammoBarFill      = document.getElementById('ammo-bar-fill');
const lifeBarFill      = document.getElementById('life-bar-fill');

// Sounds (pooled to allow overlap)
function playSound(src) {
	const a = new Audio(src);
	a.volume = 0.7;
	a.play().catch(()=>{});
	return a;
}
const sndStep = document.getElementById('snd-step');
const sndTune = document.getElementById('snd-tune');
const sndBite = document.getElementById('snd-bite');

// ── Game state ────────────────────────────────────────────────────────
const AMMO_MAX   = 100;
const LIFE_MAX   = 100;
const LIFE_STEP  = 10;   // damage per hit
const SPEED      = 4;
const FRICTION   = 0.85;
const BITE_RANGE = 50;
const SAW_RANGE  = 70;
const EXIT_RANGE = 75;

let px = 450, py = 850;   // player position
let mx = 450, my = 850;   // mouse position (SVG coords)
let velX = 0, velY = 0;

let ammo          = AMMO_MAX;
let life          = LIFE_MAX;
let totalKills    = 0;
let killedInRoom  = 0;
let roomMaxKills  = 10;
let room          = 1;
let monsterWave   = 1;     // monsters per wave

let invulnerable  = false;
let exitOpen      = false;
let gameRunning   = false;
let openDoorImg   = null;
let g_saw         = null;
let sawX          = 0;
let sawY          = 450;
let sawGoRight    = true;
let holeCount     = 0;
const keys        = {};
let bullet        = null;
let bulletFlying  = false;
const BULLET_SPD  = 0.7;  // ms per px

// Computed SVG scale (SVG is 900×900 viewBox mapped to actual pixels)
function getSVGScale() {
	const rect = svg1.getBoundingClientRect();
	return { scaleX: rect.width / 900, scaleY: rect.height / 900, left: rect.left, top: rect.top };
}

function clientToSVG(cx, cy) {
	const s = getSVGScale();
	return {
		x: Math.round((cx - s.left) / s.scaleX),
		y: Math.round((cy - s.top)  / s.scaleY)
	};
}

// ── Distance ──────────────────────────────────────────────────────────
function dist(x1, y1, x2, y2) {
	const dx = x2 - x1, dy = y2 - y1;
	return Math.sqrt(dx*dx + dy*dy);
}

// ── HUD update ────────────────────────────────────────────────────────
function updateHUD() {
	hudRoom.textContent     = `SALLE ${room}`;
	hudKillCount.textContent = totalKills;
	hudAmmoCount.textContent = ammo;
	ammoBarFill.style.width  = (ammo / AMMO_MAX * 100) + '%';
	lifeBarFill.style.width  = (life / LIFE_MAX * 100) + '%';

	// Life hearts
	let hearts = '';
	for (let i = 0; i < life / LIFE_STEP; i++) hearts += '❤️';
	// replace first line of hud-life (hearts), keep the bar
	hudLife.firstChild.textContent = hearts;
}

// ── Notification ──────────────────────────────────────────────────────
let notifTimer = null;
function showNotif(msg) {
	notif.textContent = msg;
	notif.style.opacity = '1';
	clearTimeout(notifTimer);
	notifTimer = setTimeout(() => { notif.style.opacity = '0'; }, 2000);
}

// ── Damage ────────────────────────────────────────────────────────────
function damage(amount = LIFE_STEP) {
	if (invulnerable || !gameRunning) return;
	invulnerable = true;
	life = Math.max(0, life - amount);
	playSound('pain.mp3');

	// Visual flash
	damageFlash.style.background = 'rgba(180,0,0,0.45)';
	setTimeout(() => { damageFlash.style.background = 'rgba(180,0,0,0)'; }, 150);

	player.setAttribute('filter', 'hue-rotate(180deg)');
	updateHUD();

	if (life <= 0) {
		gameOver();
		return;
	}

	setTimeout(() => {
		invulnerable = false;
		player.setAttribute('filter', '');
	}, 1200);
}

// ── Game Over / Win ───────────────────────────────────────────────────
function gameOver() {
	gameRunning = false;
	sndTune.pause();
	overlayTitle.textContent = '💀 GAME OVER';
	overlayRoom.textContent  = room;
	overlayKills.textContent = totalKills;
	overlay.classList.add('active');
}

function victory() {
	gameRunning = false;
	sndTune.pause();
	overlayTitle.textContent = '🏆 VICTOIRE !';
	overlaySub.innerHTML     = `Tu as survécu jusqu'à la salle <b>${room}</b> — <b>${totalKills}</b> kills`;
	overlayRoom.textContent  = room;
	overlayKills.textContent = totalKills;
	overlay.classList.add('active');
}

// ── Hole collision (simple bbox check) ───────────────────────────────
function checkHoles() {
	const holes = holeArea.querySelectorAll('image[id^="hole"]');
	for (const h of holes) {
		const hx = parseFloat(h.getAttribute('x')) + 100;
		const hy = parseFloat(h.getAttribute('y')) + 100;
		if (dist(px, py, hx, hy) < 60) {
			damage(LIFE_STEP * 2);
			return;
		}
	}
}

// ── Saw movement ──────────────────────────────────────────────────────
function updateSaw() {
	if (!g_saw) return;
	const spd = 4 + room * 0.5;  // faster each room
	sawX += sawGoRight ? spd : -spd;
	if (sawX > 950) sawGoRight = false;
	if (sawX < -50) sawGoRight = true;
	g_saw.setAttribute('transform', `translate(${sawX} ${sawY})`);
	if (dist(px, py, sawX, sawY) < SAW_RANGE) {
		damage();
		playSound('saw_impact.mp3');
	}
}

// ── Monster movement ──────────────────────────────────────────────────
function moveMonsters() {
	const spiders = monsterArea.querySelectorAll('.spider');
	for (const spider of spiders) {
		// Parse position from dataset (reliable) or transform
		let sx = parseFloat(spider.dataset.x) || 450;
		let sy = parseFloat(spider.dataset.y) || 450;
		const spd = 1 + (room - 1) * 0.3;  // faster each room
		if (sx < px) sx = Math.min(sx + spd, px);
		else if (sx > px) sx = Math.max(sx - spd, px);
		if (sy < py) sy = Math.min(sy + spd, py);
		else if (sy > py) sy = Math.max(sy - spd, py);

		// Clamp inside arena
		sx = Math.max(50, Math.min(850, sx));
		sy = Math.max(50, Math.min(850, sy));

		spider.dataset.x = sx;
		spider.dataset.y = sy;
		spider.setAttribute('transform', `translate(${sx} ${sy})`);

		// Orient image toward player
		const img = spider.querySelector('image');
		if (img) {
			const ang = Math.round(Math.atan2(py - sy, px - sx) * 180 / Math.PI);
			img.setAttribute('transform', `rotate(${ang} 0 0)`);
		}

		if (dist(px, py, sx, sy) < BITE_RANGE) {
			damage();
			sndBite.currentTime = 0;
			sndBite.play().catch(()=>{});
		}
	}
}

// ── Main update loop ──────────────────────────────────────────────────
function update() {
	if (!gameRunning) return;
	requestAnimationFrame(update);

	// Movement
	if (keys[90] || keys[87]) { if (velY > -SPEED) velY--; }  // Z or W
	if (keys[83])              { if (velY < SPEED)  velY++; }  // S
	if (keys[68])              { if (velX < SPEED)  velX++; }  // D
	if (keys[81] || keys[65]) { if (velX > -SPEED)  velX--; }  // Q or A

	velY *= FRICTION;
	velX *= FRICTION;
	py += Math.round(velY);
	px += Math.round(velX);

	// Clamp to arena
	px = Math.max(50, Math.min(850, px));
	py = Math.max(50, Math.min(850, py));

	// Update DOM
	player.setAttribute('transform', `translate(${px},${py})`);
	positionLight.setAttribute('transform', `translate(${px},${py})`);
	ray.setAttribute('d', `m${px} ${py}L${mx} ${my}`);

	// Player rotation toward mouse
	const ang = Math.round(Math.atan2(my - py, mx - px) * 180 / Math.PI);
	rotate1.setAttribute('transform', `rotate(${ang} 0 0)`);

	// Hazards
	moveMonsters();
	checkHoles();
	if (room >= 3) updateSaw();

	// Exit detection
	if (exitOpen && dist(px, py, 450, 0) < EXIT_RANGE) {
		exitOpen = false;
		nextRoom();
	}
}

// ── Mouse tracking ────────────────────────────────────────────────────
svg1.addEventListener('mousemove', (e) => {
	const p = clientToSVG(e.clientX, e.clientY);
	mx = p.x; my = p.y;
	torchlightPos.setAttribute('transform', `translate(${mx} ${my})`);
	ray.setAttribute('d', `m${px} ${py}L${mx} ${my}`);
});

// ── Shooting ──────────────────────────────────────────────────────────
function fire() {
	if (!gameRunning || ammo <= 0 || bulletFlying) return;
	ammo--;
	updateHUD();
	bulletFlying = true;

	const d = Math.max(10, Math.round(dist(px, py, mx, my)));
	const duration = BULLET_SPD * d;

	// Create bullet
	bullet = document.createElementNS(svg1.namespaceURI, 'circle');
	bullet.setAttribute('cx', px);
	bullet.setAttribute('cy', py);
	bullet.setAttribute('r', '4');
	bullet.setAttribute('fill', '#ff8c00');
	bullet.setAttribute('style', `filter:drop-shadow(0 0 4px orange); transition:cx ${duration}ms linear, cy ${duration}ms linear;`);
	svg1.appendChild(bullet);

	requestAnimationFrame(() => {
		requestAnimationFrame(() => {
			bullet.setAttribute('cx', mx);
			bullet.setAttribute('cy', my);
			setTimeout(() => {
				if (bullet && bullet.parentNode) bullet.parentNode.removeChild(bullet);
				bullet = null;
				bulletFlying = false;
			}, duration + 60);
		});
	});
}

svg1.addEventListener('mouseup', fire);

// ── Kill ──────────────────────────────────────────────────────────────
function killSpider(event) {
	if (!gameRunning || ammo <= 0) return;
	const img = event.currentTarget;
	const spider = img.parentNode;
	if (spider.dataset.dead) return;
	spider.dataset.dead = '1';
	img.style.pointerEvents = 'none';

	const d = Math.max(10, Math.round(dist(px, py, parseFloat(spider.dataset.x)||450, parseFloat(spider.dataset.y)||450)));
	const delay = BULLET_SPD * d + 50;

	setTimeout(() => {
		playSound('insect_death.mp3');
		img.setAttribute('href', 'splash.gif');
		img.setAttribute('opacity', '0.5');
		setTimeout(() => {
			if (spider.parentNode) spider.parentNode.removeChild(spider);
			totalKills++;
			killedInRoom++;
			hudKillCount.textContent = totalKills;

			const remaining = monsterArea.querySelectorAll('.spider').length;
			if (remaining === 0) {
				if (killedInRoom < roomMaxKills) {
					monsterWave++;
					createMonsters(monsterWave);
				} else {
					openExit();
				}
			}
		}, 300);
	}, delay);
}

// ── Create monsters ───────────────────────────────────────────────────
let monsterIdCounter = 0;
function createMonsters(count) {
	playSound('appear.mp3');
	for (let i = 0; i < count; i++) {
		let xm, ym;
		let attempts = 0;
		do {
			xm = Math.round(Math.random() * 800) + 50;
			ym = Math.round(Math.random() * 800) + 50;
			attempts++;
		} while (dist(px, py, xm, ym) < 280 && attempts < 30);

		const g = document.createElementNS(svg1.namespaceURI, 'g');
		const id = monsterIdCounter++;
		g.setAttribute('id', 'idm_' + id);
		g.setAttribute('class', 'spider');
		g.dataset.x = xm;
		g.dataset.y = ym;
		g.setAttribute('transform', `translate(${xm} ${ym})`);

		const img = document.createElementNS(svg1.namespaceURI, 'image');
		const isBlind = Math.random() < 0.25;
		img.setAttribute('href', isBlind ? 'blind_spider.gif' : 'spider.gif');
		img.setAttribute('x', -50);
		img.setAttribute('y', -50);
		img.setAttribute('width', 100);
		img.setAttribute('height', 100);
		img.setAttribute('opacity', 1);
		img.setAttribute('id', 'img_' + id);

		monsterArea.appendChild(g);
		g.appendChild(img);
		img.addEventListener('click', killSpider);
	}
}

// ── Open exit ─────────────────────────────────────────────────────────
function openExit() {
	playSound('slab.mp3');
	// Ammo pickup on room clear
	const bonus = 20 + room * 5;
	ammo = Math.min(AMMO_MAX, ammo + bonus);
	updateHUD();
	showNotif(`+${bonus} munitions !`);

	openDoorImg = document.createElementNS(svg1.namespaceURI, 'image');
	openDoorImg.setAttribute('href', '1011light.png');
	openDoorImg.setAttribute('x', 0);
	openDoorImg.setAttribute('y', 0);
	openDoorImg.setAttribute('width', 900);
	openDoorImg.setAttribute('height', 900);
	maskHide.appendChild(openDoorImg);
	walls.setAttribute('href', '1011.png');
	exitOpen = true;
}

// ── Next room ─────────────────────────────────────────────────────────
function nextRoom() {
	room++;
	playSound('slab.mp3');
	if (openDoorImg && openDoorImg.parentNode) openDoorImg.parentNode.removeChild(openDoorImg);
	walls.setAttribute('href', '1111.png');
	px = 450; py = 850;
	player.setAttribute('transform', `translate(${px},${py})`);
	updateHUD();
	showNotif(`Salle ${room}`);

	setTimeout(() => {
		// Scale difficulty
		monsterWave   = Math.min(1 + Math.floor(room / 2), 6);
		roomMaxKills  = 8 + room * 4 + Math.floor(Math.random() * 5);
		killedInRoom  = 0;
		createMonsters(monsterWave);
		createHole();

		setTimeout(() => {
			if (room === 3) createSaw();
			if (room >= 3) playSound('saw.mp3');
		}, 1000);
	}, 2000);
}

// ── Create hole ───────────────────────────────────────────────────────
function createHole() {
	playSound('crumble.mp3');
	const hole = document.createElementNS(svg1.namespaceURI, 'image');
	hole.setAttribute('href', 'hole.png');
	hole.setAttribute('width', 200);
	hole.setAttribute('height', 200);

	let rx, ry;
	// Place hole away from center spawn and far from player
	let attempts = 0;
	do {
		rx = Math.round(Math.random() * 650) + 50;
		ry = Math.round(Math.random() * 650) + 50;
		attempts++;
	} while (dist(px, py, rx + 100, ry + 100) < 200 && attempts < 30);

	hole.setAttribute('x', rx);
	hole.setAttribute('y', ry);
	hole.setAttribute('id', 'hole' + holeCount++);
	holeArea.appendChild(hole);
}

// ── Create saw ────────────────────────────────────────────────────────
function createSaw() {
	g_saw = document.createElementNS(svg1.namespaceURI, 'g');
	sawX = 0;
	sawY = Math.round(Math.random() * 700) + 100;
	sawGoRight = true;
	g_saw.setAttribute('transform', `translate(${sawX} ${sawY})`);
	g_saw.setAttribute('id', 'group_saw');

	const gRot = document.createElementNS(svg1.namespaceURI, 'g');
	gRot.setAttribute('id', 'rotate_saw');

	const sawImg = document.createElementNS(svg1.namespaceURI, 'image');
	sawImg.setAttribute('href', 'saw.png');
	sawImg.setAttribute('width', 100);
	sawImg.setAttribute('height', 100);
	sawImg.setAttribute('x', -50);
	sawImg.setAttribute('y', -50);

	const anim = document.createElementNS(svg1.namespaceURI, 'animateTransform');
	anim.setAttribute('attributeName', 'transform');
	anim.setAttribute('type', 'rotate');
	anim.setAttribute('values', '0 0 0; 360 0 0');
	anim.setAttribute('dur', '0.4s');
	anim.setAttribute('repeatCount', 'indefinite');

	gRot.appendChild(sawImg);
	gRot.appendChild(anim);
	g_saw.appendChild(gRot);
	holeArea.appendChild(g_saw);
}

// ── Keyboard ──────────────────────────────────────────────────────────
document.body.addEventListener('keydown', (e) => {
	keys[e.keyCode] = true;
	if (keys[68] || keys[81] || keys[83] || keys[90] || keys[65] || keys[87]) {
		sndStep.currentTime = 0;
		sndStep.play().catch(()=>{});
	}
});
document.body.addEventListener('keyup', (e) => { keys[e.keyCode] = false; });

// ── Intro / open ─────────────────────────────────────────────────────
function openGame() {
	svg1.removeEventListener('click', openGame);
	playSound('open.mp3');
	doorL.setAttribute('transform', 'translate(-450 0)');
	doorR.setAttribute('transform', 'translate(450 0)');
	titleImg.setAttribute('transform', 'translate(0 -450)');
	gTextStart.setAttribute('transform', 'translate(0 600)');

	setTimeout(() => {
		sndTune.volume = 0.4;
		sndTune.play().catch(()=>{});
		light.setAttribute('r', '120');
		torchlight.setAttribute('r', '100');
		ray.setAttribute('stroke-width', '150');
		scale1.setAttribute('transform', 'scale(3)');

		setTimeout(() => {
			startGroup.setAttribute('opacity', '0');
			setTimeout(() => {
				scale1.setAttribute('transform', 'scale(1)');
				startGroup.setAttribute('transform', 'translate(450 -900)');
				gTextStart.setAttribute('transform', 'translate(0 300)');

				setTimeout(() => {
					gameRunning = true;
					createMonsters(monsterWave);
					updateHUD();
					update();
				}, 600);
			}, 1000);
		}, 1000);
	}, 3000);
}

svg1.addEventListener('click', openGame);
